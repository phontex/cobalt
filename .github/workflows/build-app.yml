name: Build Cobalt App

on:
  push:
    branches:
      - main
    paths:
      - "app/android/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: app/android
        run: ./gradlew :cobalt:assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/android/cobalt/build/outputs/apk/debug/cobalt-debug.apk dist/Cobalt_v1.0.0-debug.apk
          sha256sum dist/Cobalt_v1.0.0-debug.apk > dist/Cobalt_v1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cobalt-v1.0.0-debug
          path: dist/
